<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Genel Sekreterlik AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#111827;padding-bottom:78px}
header{background:#111827;color:#fff;padding:20px 17px}.brand{font-size:22px;font-weight:800}.date{font-size:13px;opacity:.7;margin-top:4px}
main{max-width:760px;margin:auto;padding:15px}.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px #0000000c}
h2{font-size:19px;margin:6px 0 12px}.section{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 8px}
button{border:0;border-radius:11px;background:#111827;color:#fff;padding:10px 13px;font-weight:700}button.light{background:#e5e7eb;color:#111827}
.ai{background:#111827;color:#fff;border-radius:18px;padding:17px;margin-bottom:16px}.ai h2{margin-top:0}
.ai textarea{background:#fff;color:#111827;border:0;min-height:76px}
textarea,input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit;margin:5px 0 9px}
.ai button{background:#fff;color:#111827}.chips{display:flex;gap:7px;overflow:auto;margin-top:8px}.chips button{white-space:nowrap;font-size:12px;padding:8px;background:#374151;color:#fff}
.item{display:flex;gap:10px;border-top:1px solid #eee;padding:11px 0;align-items:flex-start}.item:first-child{border-top:0}
.time{font-weight:800;min-width:50px}.title{font-weight:700}.small{font-size:12px;color:#6b7280;margin-top:3px}
.check{width:20px;height:20px;margin-top:2px}.done{text-decoration:line-through;opacity:.5}.empty{color:#6b7280;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:9}
nav button{background:transparent;color:#6b7280;padding:6px 5px;font-size:11px}nav button.active{color:#111827}
.fab{position:fixed;right:18px;bottom:78px;border-radius:50%;width:54px;height:54px;font-size:23px;z-index:8}
.notice{border-left:4px solid #111827;transition:opacity .4s}.urgent{border-left:4px solid #b91c1c;background:#fff7f7}
.reminder-banner{position:sticky;top:0;z-index:7;background:#111827;color:#fff;border-radius:12px;padding:12px;margin-bottom:12px;display:none}
pre{white-space:pre-wrap;background:#f3f4f6;padding:10px;border-radius:10px;font-size:13px}

@media print{
  body{background:#fff;color:#000;padding:0}
  header{background:#fff;color:#000;border-bottom:2px solid #111;padding:10px 0}
  main{max-width:none;padding:0}
  nav,.fab,.ai,.section button,#home,.page:not(#program),#reminderBanner{display:none!important}
  #program{display:block!important}
  #program .section{display:block;margin:15px 0}
  #program .section button{display:none!important}
  #programList{box-shadow:none;border:0;padding:0}
  #programList .item{border-bottom:1px solid #ddd;padding:12px 0}
  .small{color:#333}
  .print-title{display:block!important}
}
.print-title{display:none}
</style>
</head>
<body>
<header><div class="brand">Genel Sekreterlik AI</div><div class="date" id="date"></div></header>
<main>
<div id="reminderBanner" class="reminder-banner"></div>
<section id="home" class="page active">
<div class="ai">
<h2>🤖 AI Asistan</h2>
<div style="opacity:.8;font-size:13px;margin-bottom:8px">Normal cümlenizi yazın. Sistem randevu, not, hatırlatma veya talimatı ayırır.</div>
<textarea id="cmd" placeholder="Örn: Yarın saat 10'da Salih Çelik geliyor, yarım saat önce hatırlat."></textarea>
<button onclick="aiProcess()">Komutu İşle</button>
<div class="chips">
<button onclick="fill('Yarın saat 10:00’da Salih Çelik geliyor. İl Tarım Müdürlüğü ile tarımsal yatırımları görüşeceğiz.')">Randevu örneği</button>
<button onclick="fill('Cuma günü Niksar yol tablosunu kontrol et.')">Talimat örneği</button>
<button onclick="fill('Bugün Bakanlık ödeneklerini konuşmayı unutma.')">Not örneği</button>
</div>
</div>
<div id="aiResult"></div>
<div class="section"><h2>Bugünün Programı</h2><button class="light" onclick="show('program')">Tümü</button></div>
<div class="card" id="homeProgram"></div>
<div class="section"><h2>Bugünün Hatırlatmaları</h2><button class="light" onclick="show('reminders')">Tümü</button></div>
<div class="card" id="homeReminders"></div>
<div class="section"><h2>Açık Talimatlar</h2><button class="light" onclick="show('tasks')">Tümü</button></div>
<div class="card" id="homeTasks"></div>
</section>
<section id="program" class="page"><div class="print-title"><h1>GÜNLÜK PROGRAM</h1><div id="printDate"></div></div><div class="section"><h2>📅 Program</h2><div><button class="light" onclick="printDailyProgram()">🖨️ Çıktı</button> <button onclick="addProgram()">+ Ekle</button></div></div><div class="card" id="programList"></div></section>
<section id="notes" class="page"><div class="section"><h2>📝 Notlar</h2><button onclick="addNote()">+ Ekle</button></div><div class="card" id="noteList"></div></section>
<section id="reminders" class="page"><div class="section"><h2>🔔 Hatırlatmalar</h2><button onclick="addReminder()">+ Ekle</button></div><div class="card" id="reminderList"></div></section>
<section id="tasks" class="page"><div class="section"><h2>📌 Talimatlar</h2><button onclick="addTask()">+ Ekle</button></div><div class="card" id="taskList"></div></section>
</main>
<button class="fab" onclick="quickAdd()">+</button>
<nav>
<button class="active" onclick="show('home',this)">🏠<br>Bugün</button>
<button onclick="show('program',this)">📅<br>Program</button>
<button onclick="show('notes',this)">📝<br>Notlar</button>
<button onclick="show('reminders',this)">🔔<br>Hatırlatma</button>
<button onclick="show('tasks',this)">📌<br>Talimat</button>
</nav>
<script>
const KEY='genelSekreterlikAI_v3';
let db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('genelSekreterlikAI_v2')||'{"program":[],"notes":[],"reminders":[],"tasks":[]}');
if(!db.reminders)db.reminders=[];
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
document.getElementById('date').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function show(id,btn){let ar=document.getElementById('aiResult');if(ar)ar.innerHTML='';document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render()}
function fill(s){document.getElementById('cmd').value=s}
function addProgram(){let date=prompt('Tarih (YYYY-AA-GG):',today());if(!date)return;let time=prompt('Saat:','09:00');if(!time)return;let name=prompt('Misafir adı:');if(!name)return;let role=prompt('Görevi / kurumu:','');let subject=prompt('Konu:','');db.program.push({id:Date.now(),date,time,name,role,subject});save()}
function addNote(){let text=prompt('Not:');if(text){db.notes.push({id:Date.now(),date:today(),text,done:false});save()}}
function addReminder(){let date=prompt('Tarih (YYYY-AA-GG):',today());if(!date)return;let time=prompt('Saat:','10:00');if(!time)return;let text=prompt('Hatırlatma:');if(text){db.reminders.push({id:Date.now(),date,time,text,done:false,alerted:false});save()}}
function addTask(){let text=prompt('Talimat / iş:');if(!text)return;let owner=prompt('Sorumlu:','');let due=prompt('Son tarih (YYYY-AA-GG):','');db.tasks.push({id:Date.now(),text,owner,due,done:false});save()}
function del(type,id){db[type]=db[type].filter(x=>x.id!=id);save()}
function toggle(type,id){let x=db[type].find(x=>x.id==id);if(x)x.done=!x.done;save()}
function programHTML(a){return a.length?a.map(x=>`<div class=item><div class=time>${esc(x.time)}</div><div style="flex:1"><div class=title>${esc(x.name)}</div><div class=small>${esc(x.role)}${x.subject?' · '+esc(x.subject):''}</div></div><button class=light onclick="del('program',${x.id})">Sil</button></div>`).join(''):'<div class=empty>Kayıt yok.</div>'}
function checkHTML(type,a,extra=''){return a.length?a.map(x=>`<div class=item><input class=check type=checkbox ${x.done?'checked':''} onclick="toggle('${type}',${x.id})"><div style="flex:1" class="${x.done?'done':''}"><div class=title>${esc(x.text||x.name)}</div><div class=small>${extra(x)}</div></div><button class=light onclick="del('${type}',${x.id})">Sil</button></div>`).join(''):'<div class=empty>Kayıt yok.</div>'}
function weekdayDate(text){
  const low=text.toLocaleLowerCase('tr-TR');
  const days={pazartesi:1,salı:2,çarşamba:3,perşembe:4,cuma:5,cumartesi:6,pazar:0};
  for(const name in days){
    if(low.includes(name)){
      const now=new Date(), target=days[name], cur=now.getDay();
      let diff=(target-cur+7)%7;
      // If the named day is today, keep today; otherwise use the next occurrence.
      now.setDate(now.getDate()+diff);
      return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    }
  }
  return null;
}
function aiProcess(){
let s=document.getElementById('cmd').value.trim();if(!s)return;
let low=s.toLocaleLowerCase('tr-TR'), result='', d=today(),date=d;
if(low.includes('yarın')){let x=new Date();x.setDate(x.getDate()+1);date=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
const namedDay=weekdayDate(s);
if(namedDay) date=namedDay;

if(/saat\s*\d{1,2}[:.]\d{2}/i.test(s)||low.includes('randevu')||low.includes('geliyor')||low.includes('ziyaret')){
let tm=(s.match(/saat\s*(\d{1,2}[:.]\d{2})/i)||[])[1]||'09:00';tm=tm.replace('.',':');
let name=(s.match(/saat\s*\d{1,2}[:.]\d{2}\s*(?:['’]?(?:da|de))?\s+([^,.]+?)(?:\s+geliyor|\s+gelecek|,|\.|$)/i)||[])[1]||'Yeni randevu';
let subject=(s.match(/(?:görüşeceğiz|konusu|için)\s+([^.!?]+)/i)||[])[1]||'';
db.program.push({id:Date.now(),date,time:tm,name:name.trim(),role:'',subject:subject.trim()});
let remind=/yarım saat|30 dakika|30 dk/i.test(s);
if(remind){let [h,m]=tm.split(':').map(Number);let mins=h*60+m-30;let rt=String(Math.floor((mins+1440)%1440/60)).padStart(2,'0')+':'+String((mins+1440)%1440%60).padStart(2,'0');db.reminders.push({id:Date.now()+1,date,time:rt,text:name.trim()+' randevusu',done:false,alerted:false})}
result='📅 Randevu olarak kaydettim'+(remind?' ve 30 dakika öncesine hatırlatma ekledim.':'.');
}else if(namedDay && (low.includes('not')||low.includes('programa')||low.includes('ekle')||low.includes('pazartesi')||low.includes('salı')||low.includes('çarşamba')||low.includes('perşembe')||low.includes('cuma')||low.includes('cumartesi')||low.includes('pazar'))){
db.program.push({id:Date.now(),date,time:'—',name:'Günlük Not',role:'',subject:s});
db.notes.push({id:Date.now()+1,date,text:s,done:false});
result='📅 '+new Date(date+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})+' programına not olarak ekledim.';
}else if(low.includes('unutma')||low.includes('hatırlat')||low.includes('ara ')||low.includes('hatırla')){
db.reminders.push({id:Date.now(),date,time:'09:00',text:s.replace(/yarın|bugün|cuma günü/gi,'').trim(),done:false,alerted:false});result='🔔 Hatırlatma olarak kaydettim. Saati Hatırlatmalar bölümünden değiştirebilirsiniz.';
}else if(low.includes('talimat')||low.includes('kontrol et')||low.includes('hazırla')||low.includes('sorumlu')){
db.tasks.push({id:Date.now(),text:s,owner:'',due:date,done:false});result='📌 Talimat / iş olarak kaydettim.';
}else{
db.notes.push({id:Date.now(),date,text:s,done:false});result='📝 Günlük not olarak kaydettim.';
}
document.getElementById('aiResult').innerHTML='<div class="card notice" id="tempAiResult"><b>'+result+'</b><div class="small" style="margin-top:5px">Ücretsiz yerel sürüm: kayıtlar telefonunuzda saklanır.</div></div>'; setTimeout(()=>{let e=document.getElementById('tempAiResult');if(e){e.style.opacity='0';e.style.transition='opacity .4s';setTimeout(()=>{if(e)e.remove()},450)}},4500);
document.getElementById('cmd').value='';save()
}
function quickAdd(){let c=prompt('1 Program / 2 Not / 3 Hatırlatma / 4 Talimat','1');if(c=='1')addProgram();else if(c=='2')addNote();else if(c=='3')addReminder();else if(c=='4')addTask()}
function notifyUser(title,text){
try{if('Notification' in window && Notification.permission==='granted')new Notification(title,{body:text});else alert('🔔 '+title+'\\n\\n'+text)}catch(e){alert('🔔 '+title+'\\n\\n'+text)}
}
async function enableNotifications(){
if(!('Notification' in window)){alert('Bu tarayıcıda bildirim desteği bulunmuyor. Uygulama açıkken zamanında uyarı göstereceğim.');return}
if(Notification.permission==='default')await Notification.requestPermission();
if(Notification.permission==='granted')alert('Bildirim izni verildi. Uygulama açıkken hatırlatmalar zamanı geldiğinde bildirim olarak gösterilir.');
else alert('Bildirim izni verilmedi. Uygulama açıkken ekranda uyarı göstereceğim.');
}
function printDailyProgram(){
  document.getElementById('printDate').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  window.print();
}
function checkReminders(){
let now=new Date(), ds=today(), hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
let due=db.reminders.filter(x=>x.date===ds && x.time===hm && !x.done && !x.alerted);
if(due.length){
due.forEach(x=>{x.alerted=true;notifyUser('Genel Sekreterlik Hatırlatması',x.text)});
save();
}
let upcoming=db.reminders.filter(x=>x.date===ds&&!x.done).sort((a,b)=>a.time.localeCompare(b.time));
let banner=document.getElementById('reminderBanner');
if(upcoming.length){
let next=upcoming[0];banner.style.display='block';banner.innerHTML='🔔 <b>Bugünün sıradaki hatırlatması:</b> '+esc(next.time)+' — '+esc(next.text)+'<br><button style="margin-top:7px;background:#fff;color:#111827" onclick="enableNotifications()">Bildirimleri Aç</button> <button style="margin-top:7px;background:#374151;color:#fff" onclick="show(\'reminders\')">Hatırlatmayı Gör</button>';
}else banner.style.display='none';
}
function render(){
let d=today(),p=db.program.filter(x=>x.date==d).sort((a,b)=>a.time.localeCompare(b.time)),r=db.reminders.filter(x=>x.date==d),t=db.tasks.filter(x=>!x.done);
document.getElementById('homeProgram').innerHTML=programHTML(p);
document.getElementById('homeReminders').innerHTML=checkHTML('reminders',r,x=>x.time+' · '+x.date);
document.getElementById('homeTasks').innerHTML=checkHTML('tasks',t,x=>'Sorumlu: '+(x.owner||'-')+' · Son tarih: '+(x.due||'-'));
document.getElementById('programList').innerHTML=programHTML(db.program.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)));
document.getElementById('noteList').innerHTML=checkHTML('notes',db.notes,x=>x.date);
document.getElementById('reminderList').innerHTML=checkHTML('reminders',db.reminders.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),x=>x.time+' · '+x.date);
document.getElementById('taskList').innerHTML=checkHTML('tasks',db.tasks,x=>'Sorumlu: '+(x.owner||'-')+' · Son tarih: '+(x.due||'-'));
}
render();checkReminders();setInterval(checkReminders,30000);
</script>
</body></html>
